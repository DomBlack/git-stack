# Configured but not publishing: `release.disable` keeps `goreleaser release`
# from creating a GitHub release. Use `goreleaser build --snapshot --clean`.
version: 2

project_name: git-stack

builds:
  - id: git-stack
    main: .
    binary: git-stack
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/DomBlack/git-stack/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  disable: true
