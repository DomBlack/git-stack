# Releases are cut by .github/workflows/release.yml on a v* tag. Locally,
# `goreleaser build --snapshot --clean` builds every target without publishing.
version: 2

project_name: git-stack

builds:
  - id: git-stack
    main: .
    binary: git-stack
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/DomBlack/git-stack/pkg/version.version={{ .Version }}

# `git stack update` downloads these by name, so keep the template in step with
# pkg/update.assetName.
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc

release:
  github:
    owner: DomBlack
    name: git-stack
  draft: false
  prerelease: auto
