# Releases are cut by .github/workflows/release.yml on a v* tag. Locally,
# `goreleaser build --snapshot --clean` builds every target without publishing.
version: 2

project_name: git-stack

builds:
  - id: git-stack
    main: .
    binary: git-stack
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/DomBlack/git-stack/pkg/version.version={{ .Version }}

# `git stack update` downloads these by name, so keep the template in step with
# pkg/update.assetName.
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# GitHub's own release notes: one line per merged pull request since the
# last tag, sorted into sections by label (.github/release.yml), with new
# contributors and a compare link.
changelog:
  use: github-native

release:
  github:
    owner: DomBlack
    name: git-stack
  draft: false
  prerelease: auto
  # The written notes come from the annotated tag's message (see Releasing in
  # the README); the release workflow refuses a lightweight tag, which would
  # put the tagged commit's message here instead.
  header: |
    {{ .TagSubject }}

    {{ .TagBody }}
  footer: |
    ## Upgrading

    `git stack update` swaps the binary in place, after checking the archive against
    `checksums.txt`. New to git-stack? Start with the [install guide](https://github.com/DomBlack/git-stack#install).
