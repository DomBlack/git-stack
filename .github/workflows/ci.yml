name: ci

on:
  # PR branches are covered by pull_request, so push only runs for main;
  # otherwise every push to a PR branch ran the whole matrix twice
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the old run pointless, so PR runs share a
# group per PR and cancel each other. Every other run (pushes to main) gets a
# group of its own: GitHub keeps only one pending run per group and replaces
# it, even without cancel-in-progress, so a shared group could drop main runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # mise-action caches the toolchain, not Go's module and build caches.
      - name: Find Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: golangci/golangci-lint-action@v9
        with:
          # Use the golangci-lint mise installed from mise.toml.
          install-mode: none

  shell-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # mise-action caches the toolchain, not Go's module and build caches.
      - name: Find Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install shells
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y fish zsh bash-completion
          else
            brew install fish
          fi
      - run: go test -tags shellintegration -run 'GitIntegration' -v ./pkg/shell/
