version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (io.Writer).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DomBlack/git-stack
